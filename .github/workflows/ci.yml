name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: ci-test-secret-value-at-least-32-chars
          LLM_PROVIDER: fallback
        run: python -m pytest -q
      - name: Production config validation smoke test
        working-directory: backend
        env:
          ENVIRONMENT: production
          JWT_SECRET_KEY: change-this-secret
        run: |
          if python -c "from app.core.config import Settings; Settings()" 2>/dev/null; then
            echo "::error::Production settings accepted default JWT secret"; exit 1
          fi
          echo "Fail-fast validation works"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
